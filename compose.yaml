services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-reservation-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - reservation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://reservation:${POSTGRES_PASSWORD:-local-reservation-password}@db:5432/reservation
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-deployment}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-local-admin-token-change-before-deployment}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-180}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-86400}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: "8000"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  reservation_data:
