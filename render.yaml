# Both plans are explicit: leaving plan unset can select a paid default.
# Free web services run migrations in Docker CMD because preDeployCommand is paid-only.
services:
  - type: web
    name: seat-reservation-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: seat-reservation-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_TOKEN
        sync: false
      - key: DB_POOL_SIZE
        value: "10"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: seat-reservation-db
    plan: free
    region: singapore
    databaseName: reservation
    user: reservation
    postgresMajorVersion: "17"
    ipAllowList: []
