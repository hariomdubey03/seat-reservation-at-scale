name: Reservation correctness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_TOKEN: local-admin-token-change-before-deployment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests
      - run: docker compose up --build --wait -d
      - run: pytest -q
      - run: python scripts/burst.py http://127.0.0.1:8000 --requests 1000 --concurrency 100
      - run: go run scripts/burst_http2.go -url http://127.0.0.1:8000 -requests 1000 -concurrency 100
      - run: python scripts/check_operations.py
      - name: Save service logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-logs
          path: artifacts/
      - if: always()
        run: docker compose down
