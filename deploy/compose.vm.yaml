name: seat-reservation

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reservation
      POSTGRES_USER: reservation
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - reservation_data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reservation -d reservation"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "3"}

  reservation-api:
    build:
      context: ..
    environment:
      DATABASE_URL: postgresql://reservation:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/reservation
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN}
      DB_POOL_SIZE: "10"
      DB_POOL_TIMEOUT: "180"
      TOKEN_TTL_SECONDS: "86400"
      LOG_LEVEL: INFO
      PORT: "8000"
    ports:
      - "127.0.0.1:18080:8000"
    networks:
      database:
      edge:
        aliases: [seat-reservation-api]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 256
    ulimits:
      nofile: {soft: 65536, hard: 65536}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: "30m", max-file: "3"}

networks:
  database:
    internal: true
  edge:
    external: true
    name: ${EDGE_NETWORK:-asm_net}

volumes:
  reservation_data:
